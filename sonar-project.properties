sonar.organization=osanderson
sonar.projectKey=osanderson_singpass-client-go

# Two Go modules share this repository: the library (/) and the demo
# (examples/demo, its own go.mod resolving the library through a replace).
# Both are analysed; ci.yml's go job produces a coverage profile and a test
# report for each.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Test files are tests, not source needing coverage: go test's cover profile
# never has an entry for a _test.go file itself, so left in the sources each
# would score a guaranteed 0% and inflate the coverage denominator.
sonar.exclusions=**/*_test.go

# Written by ci.yml's go job (go test -coverpkg=./... -coverprofile), one per
# module, and collected by its sonar job.
sonar.go.coverage.reportPaths=coverage.out,examples/demo/coverage.out
# Written by a second, -json go test run in the same job: pass/fail/skip
# counts and durations, a separate signal from coverage.
sonar.go.tests.reportPaths=report.json,examples/demo/report.json

# examples/minimal and the demo's cmd/keygen are example programs whose whole
# body is func main: loading flags or environment, then calling the library
# (which is tested). There is nothing left in them for a unit test to drive.
sonar.coverage.exclusions=examples/minimal/**,examples/demo/cmd/keygen/**

# Rules suppressed on specific files, each a false positive or a deliberate
# design choice there; every other rule stays active on those files, and
# these rules stay active everywhere else.
#
# go:S2077 (dynamically formatted SQL) on sqlstore/sqlstore.go: the only
# dynamic part of each statement is the table name, built from
# Config.TablePrefix, which New checks against ^[A-Za-z0-9_]*$ and panics on
# otherwise, since identifiers can't be bound as placeholders. Every value
# (state, session id, identity, expiry) is a bound placeholder.
#
# go:S5332 (insecure http://) in singpasstest: the package is a fake
# authorization server for tests, listening on loopback over plain HTTP by
# design. The client accepts it only with Dependencies.AllowLoopbackHTTP,
# which it refuses under AssuranceProduction.
#
# go:S1192 (duplicated string literals) on singpasstest/personas.go: the
# built-in test users' Myinfo data, where the same dates and names recur as
# fixture values across otherwise independent records. Naming each one would
# make the data harder to read, not easier to maintain.
#
# docker:S8431 (both a tag and a digest on an image) on the demo's
# Dockerfile: the digest makes the build reproducible, and the tag is what
# Dependabot reads to know which image stream to update the digest from.
sonar.issue.ignore.multicriteria=sqlTableNames,fakeServerHTTP,personaLiterals,imageTagAndDigest
sonar.issue.ignore.multicriteria.sqlTableNames.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.sqlTableNames.resourceKey=sqlstore/sqlstore.go
sonar.issue.ignore.multicriteria.fakeServerHTTP.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.fakeServerHTTP.resourceKey=singpasstest/**/*.go
sonar.issue.ignore.multicriteria.personaLiterals.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.personaLiterals.resourceKey=singpasstest/personas.go
sonar.issue.ignore.multicriteria.imageTagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.imageTagAndDigest.resourceKey=examples/demo/Dockerfile
