name: Fake server image

# Builds and pushes the singpass-fake-server image for a release: for amd64
# and arm64, to ghcr.io/<owner>/singpass-fake-server, tagged X.Y.Z, X.Y and
# latest (a major-only tag waits for 1.0: before it, a minor release may
# break), with provenance and an SBOM attached.
#
# release-please.yml calls it when a release is cut. It also runs weekly, and
# on demand, for the latest release: Dependabot bumps the image's base images
# on main as chore(deps), which cuts no release, so this rebuild is how the
# published image picks up patched base images and Go toolchain. A rebuild
# compiles the release's source with main's Dockerfile, so the fake server
# itself is unchanged; it re-points the release's tags at the new image.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.13.0
        type: string
        required: true
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build; empty for the latest release
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: fake-server-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Choose the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # latest only moves to the latest release, never back to an older one.
        run: |
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          TAG=${TAG:-$LATEST}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$TAG" = "$LATEST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Building the image for $TAG (latest release: $LATEST)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Checkout main's Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current
          sparse-checkout: cmd/singpass-fake-server/Dockerfile
          sparse-checkout-cone-mode: false

      # A release from before the image existed has no Dockerfile: skip it.
      - name: Use main's Dockerfile
        id: dockerfile
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ ! -f cmd/singpass-fake-server/Dockerfile ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has no fake server image: skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            cp current/cmd/singpass-fake-server/Dockerfile cmd/singpass-fake-server/Dockerfile
          fi
          rm -rf current

      - name: Set up Buildx
        if: steps.dockerfile.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.dockerfile.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        if: steps.dockerfile.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/singpass-fake-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}

      - name: Build and push
        if: steps.dockerfile.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/singpass-fake-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
