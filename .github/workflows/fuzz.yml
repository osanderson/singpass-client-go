name: Fuzz

# Runs every fuzz target daily, carrying each target's generated corpus over
# from one run to the next through the Actions cache, so coverage accumulates
# instead of starting from the seeds each time. The seeds themselves (f.Add
# and any testdata/fuzz files) run on every push as part of `go test` in
# ci.yml.
#
# A failure uploads the failing input (testdata/fuzz/<Target>/…) as an
# artifact: commit it to keep it as a regression test, then fix the bug.

on:
  schedule:
    - cron: "17 19 * * *" # daily, 03:17 Singapore time
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target (a Go duration)
        default: 5m

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./myinfo, target: FuzzParse }
          - { package: ., target: FuzzCallbackSession }
          - { package: ., target: FuzzValidateAuthContextMessage }
          - { package: ., target: FuzzValidateRedirectURI }
          - { package: ., target: FuzzCompareJWKS }
          - { package: ./singpasstest, target: FuzzParsePersonas }
          - { package: ./cmd/singpass-fake-server, target: FuzzParseJWKS }
    env:
      # A fixed GOCACHE, so the fuzz corpus (GOCACHE/fuzz) is at a known path
      # to cache.
      GOCACHE: ${{ github.workspace }}/.gocache
      FUZZTIME: ${{ inputs.fuzztime || '5m' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gocache/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: Fuzz
        run: go test "${{ matrix.package }}" -run '^$' -fuzz "^${{ matrix.target }}\$" -fuzztime "$FUZZTIME"

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gocache/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/"
          if-no-files-found: ignore
