name: Fake server published image

# Daily, checks the published singpass-fake-server image as its users get it:
# pulls ghcr.io/<owner>/singpass-fake-server:latest without logging in, on
# amd64 and on arm64, checks it is the latest release's, and logs in against
# it with this library in each of docs/docker.md's setups
# (scripts/fake-server-smoke.sh), using the release's own TestImage. Catches
# a failed or partial push, a missing platform, a package that isn't public,
# and a weekly rebuild (fake-server-image.yml) that broke something. Before
# any release has an image, it is skipped.

on:
  schedule:
    - cron: "41 1 * * *" # daily, 09:41 Singapore time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: published image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/singpass-fake-server:latest
    steps:
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Checkout main's smoke test script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current
          sparse-checkout: scripts/fake-server-smoke.sh
          sparse-checkout-cone-mode: false

      - name: Skip a release without an image
        id: dockerfile
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ ! -f cmd/singpass-fake-server/Dockerfile ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has no fake server image: skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          cp current/scripts/fake-server-smoke.sh "$RUNNER_TEMP/fake-server-smoke.sh"
          rm -rf current

      - name: Set up Go
        if: steps.dockerfile.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Anonymously, as a user would: a private package fails here.
      - name: Pull the published image
        if: steps.dockerfile.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE"
          version=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")
          arch=$(docker inspect -f '{{.Architecture}}' "$IMAGE")
          echo "$IMAGE: version $version, $arch" >> "$GITHUB_STEP_SUMMARY"
          if [ "$version" != "${TAG#v}" ]; then
            echo "latest is version $version, not the latest release, $TAG" >&2
            exit 1
          fi
          if [ "$arch" != "$ARCH" ]; then
            echo "pulled a $arch image on $ARCH" >&2
            exit 1
          fi

      - name: Log in against the image in each setup
        if: steps.dockerfile.outputs.skip != 'true'
        run: bash "$RUNNER_TEMP/fake-server-smoke.sh" "$IMAGE"
