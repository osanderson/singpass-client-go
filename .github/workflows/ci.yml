name: CI

# Format, vet, lint, build, test and vulnerability-check both modules, check
# the demo image builds, smoke-test the fake server image, lint the workflows, and analyse the code on
# SonarQube Cloud. Runs on every pull request
# (required by the protect-main ruleset) and is reused by deploy.yml, so a
# push to main is checked before it deploys.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.8.1
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  go:
    name: go (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            dir: .
          - name: demo
            dir: examples/demo
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      # go.work is gitignored; the demo resolves the library via its replace.
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/demo/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...

      - name: Build
        run: go build ./...

      # -coverpkg=./... credits a package with the coverage other packages'
      # tests give it (web through sqlstore's tests, say), not only its own.
      - name: Test
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      # A second run in go test's -json event format, for SonarQube's test
      # reporting (pass/fail/skip counts and durations). Kept separate so the
      # run above logs readable output.
      - name: Test (json, for SonarQube)
        run: go test -race -json ./... > report.json

      - name: Upload coverage and test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/coverage.out
            ${{ matrix.dir }}/report.json
          retention-days: 1

      - name: Vulnerability check
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # One SonarQube Cloud analysis per commit, over both modules, fed by the
  # coverage profiles and test reports the go job wrote. Configuration lives
  # in sonar-project.properties. This is CI-based analysis, not SonarQube
  # Cloud's Automatic Analysis, which never runs the tests and so can't see
  # coverage. Skipped when SONAR_TOKEN isn't available: pull requests from
  # forks, and Dependabot's.
  sonar:
    name: sonarqube
    needs: go
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, as SonarQube recommends, for accurate blame and
          # new-code detection.
          fetch-depth: 0

      - name: Download the library's coverage and test report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-library
          path: .

      - name: Download the demo's coverage and test report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-demo
          path: examples/demo

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2

  docker:
    name: docker (demo image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only (no push) so Dockerfile / build-context breakage shows up
      # on the PR rather than at deploy time.
      - name: Build demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/demo/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Builds the singpass-fake-server image and logs in against it with this
  # library — the test clients, keys fetched from the server, X-Custom-*
  # headers (cmd/singpass-fake-server/image_test.go) — in each of
  # docs/docker.md's setups: from the runner through the published ports,
  # from a container sharing the fake server's network namespace, and by
  # service name over HTTPS.
  fake-server-image:
    name: docker (fake server image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/singpass-fake-server/Dockerfile
          load: true
          tags: singpass-fake-server:ci
          cache-from: type=gha,scope=fake-server
          cache-to: type=gha,mode=max,scope=fake-server

      - name: Start the fake server and wait for its health check
        run: |
          docker run -d --name fake -p 5156:5156 -p 5157:5157 singpass-fake-server:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' fake)
            [ "$status" = healthy ] && exit 0
            sleep 1
          done
          docker logs fake
          echo "fake server not healthy: $status"
          exit 1

      - name: Log in from the runner
        env:
          GOWORK: "off"
          SMOKE_SINGPASS_ISSUER: http://localhost:5156/fapi
          SMOKE_CORPPASS_ISSUER: http://localhost:5157
        run: go test -count=1 -run '^TestImage$' -v ./cmd/singpass-fake-server

      - name: Log in from a container sharing its network
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          go test -c -o smoke.test ./cmd/singpass-fake-server
          docker run --rm --network container:fake -v "$PWD/smoke.test:/smoke.test:ro" \
            -e SMOKE_SINGPASS_ISSUER=http://localhost:5156/fapi -e SMOKE_CORPPASS_ISSUER=http://localhost:5157 \
            --entrypoint /smoke.test singpass-fake-server:ci -test.run '^TestImage$' -test.v

      # The same login by service name over HTTPS: the fake server keeps a
      # test CA in a volume the app container trusts.
      - name: Log in by service name over HTTPS
        run: |
          docker network create fakenet
          docker volume create fakecerts
          docker run -d --name fake-tls --network fakenet --network-alias singpass --network-alias corppass \
            -v fakecerts:/certs -e FAKE_TLS_CA_DIR=/certs \
            -e FAKE_SINGPASS_URL=https://singpass:5156 -e FAKE_CORPPASS_URL=https://corppass:5157 \
            singpass-fake-server:ci
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' fake-tls)" = healthy ] && break
            sleep 1
          done
          docker run --rm --network fakenet -v fakecerts:/certs:ro -v "$PWD/smoke.test:/smoke.test:ro" \
            -e SMOKE_CA_FILE=/certs/ca.pem \
            -e SMOKE_SINGPASS_ISSUER=https://singpass:5156/fapi -e SMOKE_CORPPASS_ISSUER=https://corppass:5157 \
            --entrypoint /smoke.test singpass-fake-server:ci -test.run '^TestImage$' -test.v

      - name: Fake server logs
        if: always()
        run: |
          docker logs fake
          docker logs fake-tls || true

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
