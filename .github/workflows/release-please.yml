name: Release Please

# Maintains a release PR from the Conventional Commits on main; merging it
# tags vX.Y.Z (the Go module version), updates CHANGELOG.md and publishes a
# GitHub release. Config: release-please-config.json and
# .release-please-manifest.json.
#
# Runs as the release-please GitHub App rather than GITHUB_TOKEN: pull
# requests opened with GITHUB_TOKEN don't trigger workflows, so the release PR
# would never get the CI checks the protect-main ruleset requires.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
