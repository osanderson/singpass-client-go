name: Release Please

# Maintains a release PR from the Conventional Commits on main; merging it
# tags vX.Y.Z (the Go module version), updates CHANGELOG.md, publishes a
# GitHub release and pushes the singpass-fake-server container image. Config: .github/release-please-config.json and
# .github/release-please-manifest.json.
#
# Uses a fine-grained personal access token (secret RELEASE_PLEASE_TOKEN;
# this repo only; Contents, Pull requests and Issues: read and write) rather
# than GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN don't trigger
# workflows, so the release PR would never get the CI checks the protect-main
# ruleset requires. The token expires — renew it before then, or release PRs
# stop getting checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # On a release, publish the singpass-fake-server image
  # (fake-server-image.yml, which also rebuilds it weekly).
  fake-server-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/fake-server-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
