name: Release Please

# Maintains a release PR from the Conventional Commits on main; merging it
# tags vX.Y.Z (the Go module version), updates CHANGELOG.md, publishes a
# GitHub release and pushes the singpass-fake-server container image, adding
# how to run it to the release notes. Config: .github/release-please-config.json and
# .github/release-please-manifest.json.
#
# Uses a fine-grained personal access token (secret RELEASE_PLEASE_TOKEN;
# this repo only; Contents, Pull requests and Issues: read and write) rather
# than GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN don't trigger
# workflows, so the release PR would never get the CI checks the protect-main
# ruleset requires. The token expires — renew it before then, or release PRs
# stop getting checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # On a release, publish the singpass-fake-server image
  # (fake-server-image.yml, which also rebuilds it weekly).
  fake-server-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/fake-server-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Once the image is pushed, add how to run it to the GitHub release, so
  # anyone following releases sees it.
  release-notes:
    needs: [release-please, fake-server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/singpass-fake-server
        run: |
          notes=$(gh release view "$TAG" --json body --jq .body)
          printf '%s\n\n### Fake server image\n\nRun the fake Singpass and Corppass servers for testing, from any language:\n\n```sh\ndocker run --rm -p 5156:5156 -p 5157:5157 %s:%s\n```\n\nSee [docs/docker.md](https://github.com/%s/blob/%s/docs/docker.md).\n' \
            "$notes" "$IMAGE" "${TAG#v}" "$GH_REPO" "$TAG" > notes.md
          gh release edit "$TAG" --notes-file notes.md
