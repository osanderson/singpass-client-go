# actionlint v1.7.12 ships stale metadata for actions/create-github-app-token@v3:
# it predates the `client-id` input (v3.2.0+), which replaces the deprecated
# `app-id`. Ignore just those two false positives, just in this workflow.
paths:
  .github/workflows/release-please.yml:
    ignore:
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
