# Cloud Run environment for the deployed demo, passed with --env-vars-file by
# .github/workflows/deploy.yml. Every deploy REPLACES the service's env vars
# with this file, so it is the single source of truth for non-secret config.
#
# Nothing here is secret: client IDs appear in every login redirect URL. The
# private keys come from Secret Manager, mounted at the *_KEY_PATH paths below
# (see the --set-secrets flags in deploy.yml). PORT is injected by Cloud Run.

# Deterministic Cloud Run URL: https://<service>-<project-number>.<region>.run.app.
# Each app's redirect URI is <APP_BASE_URL>/<app>/callback and must be
# registered with that Singpass / Corppass client. Singpass/Corppass reject
# redirect URIs containing "singpass", "corppass" or "myinfo" — hence the
# service name rp-demo and the app slugs login / mi / mib.
APP_BASE_URL: "https://rp-demo-1090410730433.asia-southeast1.run.app"
SINGPASS_ISSUER: "https://stg-id.singpass.gov.sg/fapi"
SINGPASS_AUTH_CONTEXT_TYPE: "APP_AUTHENTICATION_DEFAULT"

# --- Singpass Login ---
SINGPASS_LOGIN_CLIENT_ID: "GCnHJ1hWN90qpFNv8UxqB4XLxT5GuCMD"
SINGPASS_LOGIN_SCOPES: "email mobileno name openid user.identity"
SINGPASS_LOGIN_SIG_KEY_PATH: "/secrets/login-sig/key.pem"
SINGPASS_LOGIN_SIG_KID: "login-sig-1"
SINGPASS_LOGIN_ENC_KEY_PATH: "/secrets/login-enc/key.pem"
SINGPASS_LOGIN_ENC_KID: "login-enc-1"

